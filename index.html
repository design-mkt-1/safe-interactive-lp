<!DOCTYPE html>
<html lang="en" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topbet — Unlock Your Welcome Vault</title>
<meta name="description" content="Your Topbet welcome package is sealed in the vault. Scan to unlock it.">
<meta name="theme-color" content="#0A0A0C">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0C'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23D91C05' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ============================================================
     VIDEO STAGE
     Three stacked clips, crossfaded by opacity. The .stage__frame
     box carries the clips' native aspect ratio and is sized to
     "cover" the viewport, so anything positioned inside it in %
     units stays locked to the same point in the footage.
     ============================================================ -->
<div class="stage" id="stage">
  <div class="stage__frame" id="stageFrame">

    <video class="clip is-active" id="clipIdle"
           muted playsinline loop preload="auto"
           poster="assets/img/poster-idle.jpg"
           aria-hidden="true">
      <source type="video/webm"><source type="video/mp4">
    </video>

    <video class="clip" id="clipUnlock"
           muted playsinline preload="auto"
           poster="assets/img/poster-idle.jpg"
           aria-hidden="true">
      <source type="video/webm"><source type="video/mp4">
    </video>

    <video class="clip" id="clipOpen"
           muted playsinline preload="auto"
           poster="assets/img/poster-open.jpg"
           aria-hidden="true">
      <source type="video/webm"><source type="video/mp4">
    </video>

    <!-- Holds the final frame. Browsers sometimes drop the last decoded
         frame of a paused video, so we pin a still underneath. -->
    <img class="clip clip--still" id="clipStill"
         src="assets/img/poster-open.jpg" alt="" aria-hidden="true">

    <!-- Hold-to-scan target. Sits over the vault's scanner plate.
         Tune --scan-x / --scan-y in style.css to match the final render. -->
    <button class="scanner" id="scanner" type="button"
            aria-describedby="scanHint">
      <svg class="scanner__ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="scanner__track" cx="50" cy="50" r="46"></circle>
        <circle class="scanner__progress" id="scanProgress" cx="50" cy="50" r="46"></circle>
      </svg>
      <span class="scanner__pad" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round">
          <path d="M12 3a7 7 0 0 0-7 7v3"/>
          <path d="M19 10a7 7 0 0 0-3.5-6.06"/>
          <path d="M12 7a3 3 0 0 0-3 3v4a9 9 0 0 1-.6 3.2"/>
          <path d="M15 10a3 3 0 0 0-3-3"/>
          <path d="M12 11v3a13 13 0 0 1-.9 4.8"/>
          <path d="M15 10v4a17 17 0 0 1-.5 4"/>
          <path d="M18.5 13.5a20 20 0 0 1-.7 5.5"/>
          <path d="M5.5 16.5A11 11 0 0 0 6 13"/>
        </svg>
      </span>
      <span class="visually-hidden" id="scannerLabel">Press and hold to unlock the vault</span>
    </button>

  </div>
  <div class="stage__vignette" aria-hidden="true"></div>
</div>

<!-- ============================================================
     UI OVERLAY
     ============================================================ -->
<div class="shell">

  <header class="topbar">
    <a class="brand" href="#" aria-label="Topbet home">
      <img src="assets/img/topbet-logo.svg" alt="Topbet" width="120" height="32">
    </a>
    <span class="age-badge" aria-label="Eighteen plus only">18+</span>
  </header>

  <main class="content">

    <!-- IDLE ------------------------------------------------- -->
    <section class="panel panel--intro" id="panelIntro">
      <h1 class="headline" id="headline"></h1>
      <p class="subhead" id="subhead"></p>
      <p class="hint" id="scanHint"></p>
    </section>

    <!-- GRANTED ---------------------------------------------- -->
    <div class="granted" id="granted" role="status" aria-live="polite">
      <svg class="granted__tick" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12.5 9.5 18 20 6"/>
      </svg>
      <span id="grantedText"></span>
    </div>

    <!-- REVEAL ----------------------------------------------- -->
    <section class="panel panel--reveal" id="panelReveal" hidden>
      <p class="reveal__kicker" id="revealKicker"></p>
      <p class="reveal__offer">
        <span class="reveal__big" id="offerPrimary"></span>
        <span class="reveal__plus" id="offerSecondary"></span>
      </p>
      <div class="lock" id="lockBox">
        <p class="lock__label" id="lockLabel"></p>
        <p class="lock__timer" id="lockTimer">15:00</p>
      </div>
      <button class="cta" id="toRegister" type="button"></button>
    </section>

    <!-- REGISTER --------------------------------------------- -->
    <section class="panel panel--register" id="panelRegister" hidden>
      <h2 class="card__title" id="formTitle"></h2>

      <form class="form" id="regForm" novalidate>
        <div class="field">
          <label for="fEmail" id="lblEmail"></label>
          <input type="email" id="fEmail" name="email" autocomplete="email"
                 required aria-describedby="errEmail">
          <p class="err" id="errEmail" role="alert"></p>
        </div>

        <div class="field">
          <label for="fPassword" id="lblPassword"></label>
          <input type="password" id="fPassword" name="password"
                 autocomplete="new-password" required minlength="8"
                 aria-describedby="errPassword">
          <p class="err" id="errPassword" role="alert"></p>
        </div>

        <div class="field field--check">
          <input type="checkbox" id="fTerms" name="terms" required
                 aria-describedby="errTerms">
          <label for="fTerms" id="lblTerms"></label>
          <p class="err" id="errTerms" role="alert"></p>
        </div>

        <button class="cta cta--submit" type="submit" id="submitBtn"></button>
        <p class="form__note" id="formNote"></p>
      </form>
    </section>

  </main>

  <footer class="footer">
    <p id="footerLegal"></p>
  </footer>

</div>

<!-- Tap-to-begin, shown only if the browser refuses muted autoplay
     (iOS Low Power Mode is the usual culprit). -->
<button class="tapstart" id="tapStart" hidden>
  <span id="tapStartText"></span>
</button>

<script src="assets/js/app.js"></script>
</body>
</html>
