<!DOCTYPE html>
<html lang="uz" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topbet — Seyfni oching</title>
<meta name="description" content="Seyfda 150 000 UZS bor. Yutug'ingizni ko'paytiring.">
<meta name="theme-color" content="#131416">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131416'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23D21502' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700;800&family=Montserrat:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ============================================================
     VIDEO STAGE
     Two clips plus a pinned still, crossfaded by opacity. app.js
     sizes and places them so the vault lands on a target position
     on screen, and resolves the overlay anchors from the same
     numbers — see syncOverlay().
     ============================================================ -->
<div class="stage" id="stage">
  <div class="stage__frame" id="stageFrame">

    <video class="clip is-active" id="clipIdle"
           muted playsinline loop preload="auto"
           poster="assets/img/poster-idle.jpg"
           aria-hidden="true">
      <source type="video/webm"><source type="video/mp4">
    </video>

    <!-- Poster is the CLOSED vault, not the open one: this element is visible
         during the crossfade, before the clip plays. Its poster must match
         what it opens on, or the blend flashes the ending. -->
    <video class="clip" id="clipOpen"
           muted playsinline preload="auto"
           poster="assets/img/poster-idle.jpg"
           aria-hidden="true">
      <source type="video/webm"><source type="video/mp4">
    </video>

    <!-- Holds the final frame. Browsers sometimes drop the last decoded
         frame of a paused video, so we pin a still underneath. -->
    <img class="clip clip--still" id="clipStill"
         src="assets/img/poster-open.jpg" alt="" aria-hidden="true">

    <!-- Live glow drawn over the vault's baked neon ring. Anchored to the
         footage by the same geometry as the scanner. Carries the idle pulse
         when the idle state is a still. -->
    <span class="vaultfx" id="vaultFx" aria-hidden="true"></span>

    <!-- Hold-to-scan target, CTA #1. Sits on the vault's scanner plate;
         position and size come from SCAN_POINT in app.js. -->
    <button class="scanner" id="scanner" type="button"
            aria-describedby="scanHint">
      <!-- Traces the perimeter of the plate, matching the brackets in the art. -->
      <svg class="scanner__ring" viewBox="0 0 100 100" aria-hidden="true">
        <rect class="scanner__track" x="6" y="6" width="88" height="88" rx="10"></rect>
        <rect class="scanner__progress" id="scanProgress"
              x="6" y="6" width="88" height="88" rx="10"></rect>
      </svg>
      <span class="scanner__pad" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round">
          <path d="M12 3a7 7 0 0 0-7 7v3"/>
          <path d="M19 10a7 7 0 0 0-3.5-6.06"/>
          <path d="M12 7a3 3 0 0 0-3 3v4a9 9 0 0 1-.6 3.2"/>
          <path d="M15 10a3 3 0 0 0-3-3"/>
          <path d="M12 11v3a13 13 0 0 1-.9 4.8"/>
          <path d="M15 10v4a17 17 0 0 1-.5 4"/>
          <path d="M18.5 13.5a20 20 0 0 1-.7 5.5"/>
          <path d="M5.5 16.5A11 11 0 0 0 6 13"/>
        </svg>
      </span>
      <!-- No inner text label: app.js sets aria-label, which overrides inner
           text for accessibility naming, and a text node inside the button is
           what iOS offers to select on a long press. -->
    </button>

  </div>
  <div class="stage__vignette" aria-hidden="true"></div>
</div>

<!-- ============================================================
     UI OVERLAY
     ============================================================ -->
<div class="shell">

  <header class="topbar">
    <a class="brand" href="#" aria-label="Topbet">
      <img src="assets/img/logo_topbet.svg" alt="Topbet" width="139" height="32">
    </a>
    <div class="topbar__right">
      <button class="lang" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="langCurrent">EN</span>
        <svg class="lang__caret" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="age-badge" aria-label="18+">18+</span>
    </div>
  </header>

  <main class="content">

    <!-- IDLE ------------------------------------------------- -->
    <section class="panel panel--intro" id="panelIntro">
      <div class="card card--offer">
        <p class="offer__head">
          <span id="offerLine1"></span>
          <span id="offerLine2"></span>
        </p>
        <p class="offer__sub" id="offerSub"></p>
      </div>

      <!-- CTA #2 — the tap alternative to holding the scanner. Grouped so it
           can be pushed clear of the vault's plate, which sits mid-screen and
           carries CTA #1. -->
      <div class="intro__action">
        <div class="cta-frame">
          <button class="cta" id="openVault" type="button"></button>
        </div>
        <p class="hint" id="scanHint"></p>
      </div>
    </section>

    <!-- GRANTED ---------------------------------------------- -->
    <div class="granted" id="granted" role="status" aria-live="polite">
      <svg class="granted__tick" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12.5 9.5 18 20 6"/>
      </svg>
      <span id="grantedText"></span>
    </div>

    <!-- REVEAL ----------------------------------------------- -->
    <section class="panel panel--reveal" id="panelReveal" hidden>
      <div class="card card--offer">
        <p class="reveal__head">
          <span class="reveal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.6l1.9 5.1 5.1 1.9-5.1 1.9L12 16.6l-1.9-5.1L5 9.6l5.1-1.9L12 2.6z"/>
              <path d="M18.6 15.2l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3z"/>
              <path d="M5.2 14.4l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z"/>
            </svg>
          </span>
          <span id="revealKicker"></span>
        </p>
        <p class="reveal__amount" id="offerPrimary"></p>
        <p class="offer__sub" id="offerSecondary"></p>
      </div>

      <div class="card card--lock" id="lockBox">
        <p class="lock__line" id="lockLabel"></p>
        <p class="lock__line" id="lockSub"></p>
        <p class="lock__timer">
          <svg class="lock__clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/>
          </svg>
          <span id="lockTimer">10:00</span>
        </p>
        <div class="cta-frame">
          <button class="cta" id="toRegister" type="button"></button>
        </div>
      </div>
    </section>

    <!-- REGISTER --------------------------------------------- -->
    <section class="panel panel--register" id="panelRegister" hidden>
      <p class="reg__amount" id="regAmount"></p>
      <p class="reg__claim" id="regClaim"></p>
      <p class="reg__note" id="regNote"></p>

      <div class="card card--form">
        <div class="tabs" role="tablist">
          <button class="tab is-active" id="tabPhone" type="button" role="tab"
                  aria-selected="true" data-mode="phone">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6.6 2.8a1.7 1.7 0 0 1 2.4.5l1.6 2.5a1.7 1.7 0 0 1-.3 2.2l-1.2 1a11 11 0 0 0 4.4 4.4l1-1.2a1.7 1.7 0 0 1 2.2-.3l2.5 1.6a1.7 1.7 0 0 1 .5 2.4l-1 1.5c-.7 1-2 1.4-3.2 1A18.6 18.6 0 0 1 3.9 7.5c-.4-1.2 0-2.5 1-3.2l1.7-1.5z"/>
            </svg>
            <span id="tabPhoneText"></span>
          </button>
          <button class="tab" id="tabEmail" type="button" role="tab"
                  aria-selected="false" data-mode="email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
              <path d="m3 7 8.2 5.6a1.5 1.5 0 0 0 1.6 0L21 7"/>
            </svg>
            <span id="tabEmailText"></span>
          </button>
        </div>

        <form class="form" id="regForm" novalidate>

          <!-- phone mode -->
          <div class="field-row" id="rowPhone">
            <button class="dial" id="dialBtn" type="button" aria-label="+998 (UZ)">
              <span class="dial__flag" aria-hidden="true">
                <svg viewBox="0 0 30 20">
                  <rect width="30" height="6.4" fill="#0099b5"/>
                  <rect y="6.4" width="30" height="1" fill="#ce1126"/>
                  <rect y="7.4" width="30" height="5.2" fill="#fff"/>
                  <rect y="12.6" width="30" height="1" fill="#ce1126"/>
                  <rect y="13.6" width="30" height="6.4" fill="#1eb53a"/>
                  <circle cx="6.6" cy="3.4" r="2.2" fill="#fff"/>
                  <circle cx="7.5" cy="3.4" r="2.2" fill="#0099b5"/>
                </svg>
              </span>
              <svg class="dial__caret" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor"
                      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <input class="input" type="tel" id="fPhone" name="phone"
                   inputmode="tel" autocomplete="tel-national"
                   aria-describedby="errPhone">
          </div>
          <p class="err" id="errPhone" role="alert"></p>

          <!-- email mode -->
          <div class="field-row" id="rowEmail" hidden>
            <input class="input" type="email" id="fEmail" name="email"
                   autocomplete="email" aria-describedby="errEmail">
          </div>
          <p class="err" id="errEmail" role="alert"></p>

          <div class="field-row">
            <span class="select">
              <svg class="select__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="8" width="18" height="4" rx="1"/>
                <path d="M5 12v8h14v-8M12 8v12"/>
                <path d="M12 8S10.5 4 8.5 4a2 2 0 0 0 0 4M12 8s1.5-4 3.5-4a2 2 0 0 1 0 4"/>
              </svg>
              <select class="select__control" id="fBonus" name="bonus"></select>
              <svg class="select__caret" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor"
                      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="cta-frame cta-frame--flat">
            <button class="cta" type="submit" id="submitBtn"></button>
          </div>

          <p class="form__note" id="formNote"></p>
        </form>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p id="footerLegal"></p>
  </footer>

</div>

<!-- Tap-to-begin, shown only if the browser refuses muted autoplay
     (iOS Low Power Mode is the usual culprit). -->
<button class="tapstart" id="tapStart" hidden>
  <span id="tapStartText"></span>
</button>

<script src="assets/js/app.js"></script>
</body>
</html>
